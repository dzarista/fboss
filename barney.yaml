    finalizers:
      - [ 'sh', '-c', 'test -e /usr/share/ptest-data/Fboss/RPMS/xgs/6.4/arista-fboss-core-1-1.el9.x86_64.rpm' ]
      - [ 'sh', '-c', 'test -e /usr/share/ptest-data/Fboss/RPMS/xgs/6.4/arista-fboss-platform-darwin-1-1.el9.x86_64.rpm' ]
      - [ 'sh', '-c', 'test -e /usr/share/ptest-data/Fboss/RPMS/xgs/6.4/arista-fboss-platform-darwin48v-1-1.el9.x86_64.rpm' ]
      - [ 'sh', '-c', 'test -e /usr/share/ptest-data/Fboss/RPMS/xgs/6.4/arista-fboss-platform-meru400bia-1-1.el9.x86_64.rpm' ]
      - [ 'sh', '-c', 'test -e /usr/share/ptest-data/Fboss/RPMS/xgs/6.4/arista-fboss-platform-meru800bfa-1-1.el9.x86_64.rpm' ]
      - [ 'sh', '-c', 'test -e /usr/share/ptest-data/Fboss/RPMS/xgs/6.4/arista-fboss-platform-meru800bia-1-1.el9.x86_64.rpm' ]
      - [ 'sh', '-c', 'test -e /usr/share/ptest-data/Fboss/RPMS/xgs/6.4/arista-fboss-platform-meru800biab-1-1.el9.x86_64.rpm' ]
      - [ 'sh', '-c', 'test -e /usr/share/ptest-data/Fboss/RPMS/xgs/6.4/arista-fboss-platform-meru800ba-1-1.el9.x86_64.rpm' ]
      - [ 'sh', '-c', 'test -e /usr/share/ptest-data/Fboss/RPMS/xgs/6.4/arista-fboss-platform-yamp-1-1.el9.x86_64.rpm' ]
      - [ 'sh', '-c', 'test -e /usr/share/ptest-data/Fboss/RPMS/xgs/6.4/arista_bsp_kmods-0.5.0-1.el9.x86_64.rpm' ]
