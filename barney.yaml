images:
  kernel-6.4:
    units:
    - floor: code.arista.io/os/fboss-centos%fboss-centos-image-el9
      build: arista/fbossctl kernel_pull 6.4 $DESTDIR/kernel-6.4

  kernel-6.11:
    units:
    - floor: code.arista.io/os/fboss-centos%fboss-centos-image-el9
      build: arista/fbossctl kernel_pull 6.4 $DESTDIR/kernel-6.11

  internal/build-env:
    entry:
      env:
        FBOSS_BARNEY_BUILD: "True"
        FBOSS_ARTIFACTORY_TOKEN: ${secrets.fboss-artifactory-token}
        CCACHE_SECONDARY_STORAGE: ${secrets.ccache-url}
      mutables:
        - /var/FBOSS
      secrets:
        fboss-artifactory-token:
          global-name: "fboss-artifactory-reference-token"
        ccache-url:
          global-name: "barney-fboss-ccache-url"

  bus:
    entry:
      env:
        CCACHE_SECONDARY_STORAGE: "${secrets.fboss_ccache_remote_storage_url:-redis://fboss-ccache-redis.infra.corp.arista.io:65530}|read-only=true"
    units:
      - image: code.arista.io/os/fboss-centos%fboss-centos-image-el9
      - image: code.arista.io/fboss/fboss-bcm-sai%sai-11.7.0-sdk-6.5.30-dnx-kernel-6.4
      - image: code.arista.io/fboss/fboss-bcm-sdk%sdk-6.5.30-dnx-kernel-6.4
      - image: code.arista.io/fboss/fboss-bcm-sai%sai-10.2.0-sdk-6.5.29-xgs-kernel-6.4
      - image: code.arista.io/fboss/fboss-bcm-sdk%sdk-6.5.29-xgs-kernel-6.4
      - image: code.arista.io/fboss/fboss-bcm-sai%sai-14.0-sdk-6.5.34-xgs-kernel-6.11
      - image: code.arista.io/fboss/fboss-bcm-sdk%sdk-6.5.34-xgs-kernel-6.11
      - image: .%kernel-6.4
      - image: .%kernel-6.11

  package_platform:
    units:
    - floor: code.arista.io/os/fboss-centos%fboss-centos-image-el9
      build: |
        export PTESTDIR=$DESTDIR/usr/share/ptest-data/Fboss
        ./package.sh --export-dir $PTESTDIR --platform-only --compress
        mkdir -p $PTESTDIR/RPMS/platform/
        mv $PTESTDIR/RPMS/*.rpm $PTESTDIR/RPMS/platform

  build-floor/dnx_6.4-el9:
    units:
      - image: code.arista.io/os/fboss-centos%fboss-centos-image-el9
      - image: code.arista.io/fboss/fboss-bcm-sai%sai-11.7.0-sdk-6.5.30-dnx-kernel-6.4
      - image: code.arista.io/fboss/fboss-bcm-sdk%sdk-6.5.30-dnx-kernel-6.4
      - image: .%kernel-6.4
      - image: .%internal/build-env

  package_dnx_6.4-el9:
    units:
      - floor: .%build-floor/dnx_6.4-el9
        build: |
          export PTESTDIR=$DESTDIR/usr/share/ptest-data/Fboss
          ./build.sh --sai dnx-11.7 --kernel-dir /kernel-6.4
          ./package.sh --export-dir $PTESTDIR --core-only --compress
          mkdir -p $PTESTDIR/RPMS/core/dnx/6.4
          mv $PTESTDIR/RPMS/*.rpm $PTESTDIR/RPMS/core/dnx/6.4
        quota:
          memory: 270G
          cpu: 10

  build-floor/xgs_6.4-el9:
    units:
      - image: code.arista.io/os/fboss-centos%fboss-centos-image-el9
      - image: code.arista.io/fboss/fboss-bcm-sai%sai-10.2.0-sdk-6.5.29-xgs-kernel-6.4
      - image: code.arista.io/fboss/fboss-bcm-sdk%sdk-6.5.29-xgs-kernel-6.4
      - image: .%kernel-6.4
      - image: .%internal/build-env

  package_xgs_6.4-el9:
    units:
      - floor: .%build-floor/xgs_6.4-el9
        build: |
          export PTESTDIR=$DESTDIR/usr/share/ptest-data/Fboss
          ./build.sh --sai xgs-10.2 --kernel-dir /kernel-6.4
          ./package.sh --export-dir $PTESTDIR --core-only --compress
          mkdir -p $PTESTDIR/RPMS/core/xgs/6.4
          mv $PTESTDIR/RPMS/*.rpm $PTESTDIR/RPMS/core/xgs/6.4
        quota:
          memory: 270G
          cpu: 10

  test/package_dnx_6.4-el9:
    description: Run swtests for package_dnx_6.4-el9 image
    units:
      - floor: code.arista.io/os/fboss-centos%fboss-centos-image-el9
        mappings:
          /src/out: .%package_dnx_6.4-el9
        build: |
          core_rpm=/src/out/usr/share/ptest-data/Fboss/RPMS/core/dnx/6.4/arista-fboss-core-1-1.el9.x86_64.rpm
          rpm2cpio $core_rpm | cpio -D /tmp -idmv
          LD_LIBRARY_PATH=/tmp/opt/fboss/lib ./arista/core/scripts/run_sw_tests.sh /tmp/opt/fboss/bin

  test/package_xgs_6.4-el9:
    description: Run swtests for package_xgs_6.4-el9 image
    units:
      - floor: code.arista.io/os/fboss-centos%fboss-centos-image-el9
        mappings:
          /src/out: .%package_xgs_6.4-el9
        build: |
          core_rpm=/src/out/usr/share/ptest-data/Fboss/RPMS/core/xgs/6.4/arista-fboss-core-1-1.el9.x86_64.rpm
          rpm2cpio $core_rpm | cpio -D /tmp -idmv
          LD_LIBRARY_PATH=/tmp/opt/fboss/lib ./arista/core/scripts/run_sw_tests.sh /tmp/opt/fboss/bin
