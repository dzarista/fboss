images:
  kernel-6.4:
    units:
    - floor: code.arista.io/os/fboss-centos%fboss-centos-image-el9
      build: arista/fbossctl kernel_pull 6.4 $DESTDIR/kernel-6.4

  fboss-dependencies:
    units:
    - floor: code.arista.io/os/fboss-centos%fboss-centos-image-el9
      entry:
        mutables: [ /var/FBOSS ]
      build: |
        dest=$DESTDIR; scratch=/var/FBOSS/tmp_build_dir; unset DESTDIR
        export GETDEPS_USE_WGET=1

        rm -rf build/deps/github_hashes/
        tar xvzf fboss/oss/stable_commits/latest_stable_hashes.tar.gz

        for _ in {1..5}; do
          ./build/fbcode_builder/getdeps.py build --allow-system-packages --num-jobs 40 \
            --scratch-path $scratch --build-type MinSizeRel --only-deps fboss \
            --extra-cmake-defines='{"CMAKE_CXX_STANDARD":"20"}' && break
        done
        mkdir -p $dest/$scratch; mv $scratch/* $dest/$scratch/
        mkdir -p $dest/etc/bus-setup.d/
        echo 'sudo chown -R $USER:$USER '$scratch >> $dest/etc/bus-setup.d/scratch-dir-setup.sh

  build-floor/dnx_6.4-el9:
    units:
      - image: code.arista.io/os/fboss-centos%fboss-centos-image-el9
      - image: code.arista.io/fboss/fboss-bcm-sai%sai-11.7.0-sdk-6.5.30-dnx-kernel-6.4
      - image: code.arista.io/fboss/fboss-bcm-sdk%sdk-6.5.30-dnx-kernel-6.4
      - image: .%kernel-6.4
      - image: .%fboss-dependencies
    entry:
      mutables:
        - /var/FBOSS/tmp_build_dir

  package_dnx_6.4-el9:
    units:
      - floor: .%build-floor/dnx_6.4-el9
        build: |
          export PTESTDIR=$DESTDIR/usr/share/ptest-data/Fboss
          ./build.sh --arch dnx --sai-sdk-dir /result --kernel-dir /kernel-6.4
          ./package.sh --sai-sdk-dir /result --export-dir $PTESTDIR --compress
          mkdir -p $PTESTDIR/RPMS/dnx/6.4
          mv $PTESTDIR/RPMS/*.rpm $PTESTDIR/RPMS/dnx/6.4

  build-floor/xgs_6.4-el9:
    units:
      - image: code.arista.io/os/fboss-centos%fboss-centos-image-el9
      - image: code.arista.io/fboss/fboss-bcm-sai%sai-10.2.0-sdk-6.5.29-xgs-kernel-6.4
      - image: code.arista.io/fboss/fboss-bcm-sdk%sdk-6.5.29-xgs-kernel-6.4
      - image: .%kernel-6.4
      - image: .%fboss-dependencies
    entry:
      mutables:
        - /var/FBOSS/tmp_build_dir

  package_xgs_6.4-el9:
    units:
      - floor: .%build-floor/xgs_6.4-el9
        build: |
          export PTESTDIR=$DESTDIR/usr/share/ptest-data/Fboss
          ./build.sh --arch xgs --sai-sdk-dir /result --kernel-dir /kernel-6.4
          ./package.sh --sai-sdk-dir /result --export-dir $PTESTDIR --compress
          mkdir -p $PTESTDIR/RPMS/xgs/6.4
          mv $PTESTDIR/RPMS/*.rpm $PTESTDIR/RPMS/xgs/6.4

  test/package_dnx_6.4-el9:
    description: |
      Test that build artifacts exist.
    units:
      - image: code.arista.io/os/fboss-centos%fboss-centos-image-el9
      - image: .%package_dnx_6.4-el9
    finalizers:
      - [ 'sh', '-c', 'test -e /usr/share/ptest-data/Fboss/RPMS/dnx/6.4/arista-fboss-core-1-1.el9.x86_64.rpm' ]
      - [ 'sh', '-c', 'test -e /usr/share/ptest-data/Fboss/RPMS/dnx/6.4/arista-fboss-platform-darwin-1-1.el9.x86_64.rpm' ]
      - [ 'sh', '-c', 'test -e /usr/share/ptest-data/Fboss/RPMS/dnx/6.4/arista-fboss-platform-darwin48v-1-1.el9.x86_64.rpm' ]
      - [ 'sh', '-c', 'test -e /usr/share/ptest-data/Fboss/RPMS/dnx/6.4/arista-fboss-platform-meru400bia-1-1.el9.x86_64.rpm' ]
      - [ 'sh', '-c', 'test -e /usr/share/ptest-data/Fboss/RPMS/dnx/6.4/arista-fboss-platform-meru800bfa-1-1.el9.x86_64.rpm' ]
      - [ 'sh', '-c', 'test -e /usr/share/ptest-data/Fboss/RPMS/dnx/6.4/arista-fboss-platform-meru800bia-1-1.el9.x86_64.rpm' ]
      - [ 'sh', '-c', 'test -e /usr/share/ptest-data/Fboss/RPMS/dnx/6.4/arista-fboss-platform-meru800biab-1-1.el9.x86_64.rpm' ]
      - [ 'sh', '-c', 'test -e /usr/share/ptest-data/Fboss/RPMS/dnx/6.4/arista-fboss-platform-meru800ba-1-1.el9.x86_64.rpm' ]
      - [ 'sh', '-c', 'test -e /usr/share/ptest-data/Fboss/RPMS/dnx/6.4/arista-fboss-platform-yamp-1-1.el9.x86_64.rpm' ]
      - [ 'sh', '-c', 'test -e /usr/share/ptest-data/Fboss/RPMS/dnx/6.4/arista_bsp_kmods-0.5.0-1.el9.x86_64.rpm' ]
      - [ 'sh', '-c', 'test -e /usr/share/ptest-data/Fboss/RPMS/dnx/6.4/showtech-arista-1-1.el9.x86_64.rpm' ]

  test/package_xgs_6.4-el9:
    description: |
      Test that build artifacts exist.
    units:
      - image: code.arista.io/os/fboss-centos%fboss-centos-image-el9
