name: Run Config Generation Tool Test Suite

on:
  pull_request:
    paths:
      - 'arista/util/configs-and-diagrams/**'

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.x'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install diagrams

    - name: Run test suite
      run: |
        cd arista/util/configs-and-diagrams
        python -m GenerateConfigsAndDiagrams.PmConfigTests
        python -m GenerateConfigsAndDiagrams.SensorServiceTests