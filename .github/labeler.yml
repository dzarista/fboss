      - 'fboss/platform/fw_util/**'
      - 'fboss/platform/configs/**/fw_util.json'

# Add 'led_service' label to any led_service service or config changes.
led_service:
  - changed-files:
    - any-glob-to-any-file:
      - 'fboss/led_service/**'
      - 'fboss/platform/configs/**/led_manager.json'

# Add 'platform_manager' label to any PM service or config changes.
platform_manager:
