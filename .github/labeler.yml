    - any-glob-to-any-file:
      - 'fboss/platform/platform_manager/**'
      - 'fboss/platform/configs/**/platform_manager.json'

# Add 'platform_mapping' label to any platform_mapping changes.
platform_mapping:
  - changed-files:
    - any-glob-to-any-file:
      - 'fboss/agent/platforms/**'

# Add 'rackmon' label to any rackmon service changes.
rackmon:
