# This file defines rules for automatic labeling of PRs.
# See https://github.com/marketplace/actions/labeler for syntax details.
# A basic thing to note is that any-* rules are ORed and all-* rules are ANDed.

# Please keep labels in alphabetical order per label type and file glob
# entries in alphabetical order per label.


# Category labels: label based on general categories of code changes.

# Add 'arista_bsp' label to any Arista BSP changes.
arista_bsp:
  - changed-files:
    - any-glob-to-any-file:
      - 'fboss.bsp.arista/**'

# Add 'ci' label to any build/package/workflow scripts or config.
ci:
  - changed-files:
    - any-glob-to-any-file:
      - '.github/**'
      - 'arista/build-utils/**'
      - 'arista/core/systemd/**'
      - arista/fbossctl
      - 'arista/rpm/**'
      - 'arista-ci-scripts/**'
      - barney.yaml
      - build.sh
      - 'fboss.bsp.arista/rpmbuild/**'
      - package.sh

# Add 'configs' label to any platform configuration changes.
configs:
  - changed-files:
    - any-glob-to-any-file:
      - 'arista/**/config/**'
      - 'fboss/agent/platforms/**'
      - 'fboss/lib/bsp/**'
      - 'fboss/platform/configs/**'

# Add 'firmware' label to any firmware binary or tool changes.
firmware:
  - changed-files:
    - any-glob-to-any-file:
      - 'arista/psu-upgrade/**'
      - 'fboss.bsp.arista/**/firmware/**'
      - 'fboss.bsp.arista/fw-util-common/**'

# Add 'kmods' label to any kmod or kmod tool changes.
kmods:
  - changed-files:
    - any-glob-to-any-file:
      - 'fboss.bsp.arista/bsp-kmods/**'
      - 'fboss.bsp.arista/fbiob-util/**'

# Add 'scripts' label to any internal script changes.
scripts:
  - changed-files:
    - any-glob-to-any-file:
      - 'arista/**/scripts/**'
      - 'fboss.bsp.arista/scripts/**'

# Add 'showtech' label to any showtech changes.
showtech:
  - changed-files:
    - any-glob-to-any-file:
      - 'fboss/platform/showtech/**'
      - 'fboss.bsp.arista/showtech/**'

# Add 'utils' label to any Arista utility changes.
utils:
  - changed-files:
    - any-glob-to-any-file:
      - 'arista/util/**'
      - 'arista/python-config-generator/**'
      - 'arista/python-state-sync/**'
      - 'arista/platform/lib/**'


# Feature labels: label based on which features are being changed.

# Add 'bsp_mapping' label to any bsp_mapping changes.
bsp_mapping:
  - changed-files:
    - any-glob-to-any-file:
      - 'fboss/lib/bsp/**'

# Add 'fan_service' label to any fan_service service or config changes.
fan_service:
